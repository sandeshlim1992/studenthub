# Dependabot proposes security fixes only, one grouped pull request per ecosystem against develop.
# Routine version bumps stay off (open-pull-requests-limit: 0 applies to them, not to security fixes).
# Nothing happens until "Dependabot alerts" and "Dependabot security updates" are switched on in the
# repository's Settings → Code security.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      bundler-security:
        applies-to: security-updates
        patterns: ['*']
