query ticketChecklist($ticketId: ID!) {
  ticketChecklist(ticketId: $ticketId) {
    id
    name
    completed
    incomplete
    items {
      id
      text
      checked
      updatedAt
      updatedBy {
        id
        fullname
      }
      ticketReference {
        ticket {
          ...referencingTicket
        }
      }
    }
  }
}
