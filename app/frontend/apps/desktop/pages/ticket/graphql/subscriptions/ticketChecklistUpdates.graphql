subscription ticketChecklistUpdates($ticketId: ID!) {
  ticketChecklistUpdates(ticketId: $ticketId) {
    ticketChecklist {
      id
      name
      completed
      incomplete
      items {
        id
        text
        checked
        updatedAt
        updatedBy {
          id
          fullname
        }
        ticketReference {
          ticket {
            ...referencingTicket
          }
        }
      }
    }
    removedTicketChecklist
  }
}
